# Tiny Tapeout project information
project:
  title:        "Protocol Emulator"      # Project title
  author:       "Umer Imran"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Reprogrammable protocol emulator: a tiny pin-timing CPU for UART, SPI and I2C"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A CMOS5L tile is about 202x155 uM.
  tiles: "6x4"          # CMOS5L valid values: 1x1 1x2 2x1 2x2 3x1 3x2 3x4 4x1 4x2 4x4 5x4 6x1 6x2 6x4 8x1 8x2
                        # 6x4 = 1289.28 x 710.64 um, per the Jane Street competition rules.

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_umerimran_protoemu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "protoemu_top.v"
    - "protoemu_sm.v"
    - "protoemu_arb.v"
    - "protoemu_cfg.v"
    - "protoemu_imem.v"
    - "protoemu_capture.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "cfg_sclk"
  ui[1]: "cfg_mosi"
  ui[2]: "cfg_cs_n"
  ui[3]: "run"
  ui[4]: "trig_in"
  ui[5]: "aux_in0"
  ui[6]: "aux_in1"
  ui[7]: "step"

  # Outputs
  uo[0]: "cfg_miso"
  uo[1]: "irq"
  uo[2]: "sm0_active"
  uo[3]: "cap_overflow"
  uo[4]: "trace0"
  uo[5]: "trace1"
  uo[6]: "trace2"
  uo[7]: "halted"

  # Bidirectional pins
  uio[0]: "pio0"
  uio[1]: "pio1"
  uio[2]: "pio2"
  uio[3]: "pio3"
  uio[4]: "pio4"
  uio[5]: "pio5"
  uio[6]: "pio6"
  uio[7]: "pio7"

# Do not change!
yaml_version: 6
