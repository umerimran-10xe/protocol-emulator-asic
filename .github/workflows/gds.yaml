name: gds

# Hardening costs about three hours for this design, so it runs as rarely as it
# usefully can: only on main, and only when something that can actually change
# the layout changes -- RTL, the LibreLane config, the project definition.
#
# main only, because main is what the submission is built from, and a run on a
# feature branch just duplicates the run the merge will trigger anyway. Use
# workflow_dispatch to harden a branch on demand before merging something
# risky.
#
# info.yaml is in the list because it sets the tile count, the pinout and the
# top module, all of which change the layout.
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'info.yaml'
      - '.github/workflows/gds.yaml'
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ihp-cmos5l
        with:
          pdk: ihp-sg13cmos5l

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ihp-cmos5l

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ihp-cmos5l
